name: Build KICKOFF WINS GIFTS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - kickoff-wins-gifts-foundation
    paths:
      - "efootball-app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efootball-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: efootball-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install current SDK components explicitly. Do not request the obsolete
      # standalone "tools" package (it causes sdkmanager to exit with code 1).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint app
        run: npx expo lint

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: efootball-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-wins-gifts-android-apk
          path: efootball-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
