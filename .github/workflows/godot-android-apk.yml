name: Build KICKOFF WINS GIFTS Godot Android APK
# Re-run Android export after enabling Gradle build in the Android preset.

on:
  workflow_dispatch:
  push:
    branches:
      - kickoff-wins-gifts-foundation
    paths:
      - "godot-game/**"
      - ".github/workflows/godot-android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Import and validate project
        run: godot --headless --editor --path godot-game --quit
      - name: Configure Android SDK and debug signing key for Godot
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Export debug APK
        run: |
          mkdir -p godot-game/build
          godot --headless --verbose --path godot-game --export-debug Android godot-game/build/KICKOFF_WINS_GIFTS.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KICKOFF-WINS-GIFTS-Android-APK
          path: godot-game/build/KICKOFF_WINS_GIFTS.apk
          if-no-files-found: error
          retention-days: 14
